name: Compile single headers
on:
  push:
    branches:
      - master
  pull_request:
concurrency:
  # Push runs are keyed by SHA so each merge commit lands in a group of its own
  # and cannot be superseded.  cancel-in-progress: false is NOT sufficient for
  # that: a concurrency group holds at most one running and one pending run,
  # and a newer arrival evicts the pending one, so two merges in quick
  # succession silently drop the first commit's validation.
  #
  # Observed, not theoretical: merging #8 cancelled this workflow's pending
  # master run outright, while linux-full-tests.yml and linux-nondefault.yml --
  # already keyed by SHA in that PR -- kept theirs and ran both commits.
  #
  # Pull requests and workflow_dispatch keep ref-keying, so a new push to a
  # branch supersedes its previous run instead of queueing behind it.  The dev
  # host has one quantlib-dev runner shared with five other repos, and GitHub
  # cancels runs that sit queued for 24 hours.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  headers:
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    steps:
    - uses: actions/checkout@v6
    - name: Cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: single-headers-${{ github.ref }}
        restore-keys: |
          single-headers-${{ github.ref }}
          single-headers-refs/heads/master
          single-headers-
    - name: Check
      env:
        CXX: ccache g++
      run: |
        ./tools/check_all_headers.sh
