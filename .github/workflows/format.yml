name: Formatting

# Fork-supported platform is RHEL/CentOS 10+ (memory:
# project_supported_platforms.md).  Stream 10 ships clang-tools-extra
# at LLVM 22.x natively, so the gate uses dnf instead of pinning
# apt.llvm.org -- same approach as ~/cayuga/.github/workflows/format.yml.

on:
  push:
    branches: [master]
  pull_request:
    branches:
      - '**'

concurrency:
  # One in-flight run per workflow per ref: a new push supersedes the
  # previous run instead of queueing behind it.  The dev host has a
  # single quantlib-dev runner, and GitHub cancels runs that sit queued
  # for 24 hours -- which is how master's post-merge validation was lost.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    steps:
      - uses: actions/checkout@v6

      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' files < <(find ql test-suite Examples fuzz-test-suite \
              -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0)
          clang-format --dry-run -Werror "${files[@]}"
