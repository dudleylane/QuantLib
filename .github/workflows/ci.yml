  # ===== from coveralls.yml =====
  # Fork-supported platform is RHEL/CentOS 10+ (memory:
  # project_supported_platforms.md).  Runs inside CentOS Stream 10 with
  # gcc-toolset-15; lcov from EPEL.
  coverage:
    if: needs.changes.outputs.ci_only != 'true'
    needs: [clang-format, filelists, changes]
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    steps:
      - uses: actions/checkout@v7

      - name: Compile
        shell: bash
        run: |
          ./autogen.sh
          ./configure --disable-shared CXXFLAGS='-O1 -fprofile-arcs -ftest-coverage' LDFLAGS='-lgcov'
          make -j"$(nproc)"

      - name: Capture baseline
        shell: bash
        run: |
          mkdir -p coverage tmp
          lcov --no-external --capture --initial --ignore-errors mismatch --directory . --output-file ./tmp/lcov_base.info

      - name: Run tests
        shell: bash
        run: |
          ./test-suite/quantlib-test-suite --log_level=message

      - name: Run examples
        shell: bash
        run: |
          make -C Examples check-examples

      - name: Capture coverage
        shell: bash
        run: |
          lcov --no-external --capture --ignore-errors mismatch --directory . --output-file ./tmp/lcov_run.info
          lcov --add-tracefile ./tmp/lcov_base.info --add-tracefile ./tmp/lcov_run.info --output-file ./tmp/lcov_total.info
          lcov --remove ./tmp/lcov_total.info "$PWD/Examples/*" "$PWD/test-suite/*" --output-file ./coverage/lcov.info

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info

  # ===== from codeql-analysis.yml =====
  # to commit it to your repository.
  #
  # You may wish to alter this file to override the set of languages analyzed,
  # or to provide custom queries or build logic.
  analyze:
    if: needs.changes.outputs.ci_only != 'true'
    needs: [clang-format, filelists, changes]
    name: CodeQL analysis
    # This repo's default workflow permission is read-only, so GITHUB_TOKEN
    # could not upload the SARIF results and the job ended with "Resource not
    # accessible by integration -- CodeQL job status was configuration error",
    # after the analysis itself had run to completion.  Granted here rather
    # than by widening the repository-wide default.
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    timeout-minutes: 180
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: cpp
        config-file: ./.github/codeql/codeql-config.yml

    - name: Build
      run: |
        ./autogen.sh
        ./configure --disable-static CC="gcc" CXX="g++" \
          CXXFLAGS="-O2 -g0 -Wall -Wno-unknown-pragmas"
        make -j"$(nproc)"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        ram: 10240
        threads: 8

  # ===== from test-times.yml =====
  # Fork-supported platform is RHEL/CentOS 10+ (memory:
  # project_supported_platforms.md).  Wall-clock numbers from a shared
  # CI runner are inherently noisy; tools/check_test_times.py treats
  # this as advisory regression-flagging, not a hard gate.
  check-test-times:
    if: needs.changes.outputs.ci_only != 'true'
    needs: [clang-format, filelists, changes]
    # Advisory, not gating.  tools/check_test_times.py compares absolute
    # wall-clock seconds against fixed thresholds, and this host runs six
    # self-hosted runners on four cores, so the numbers measure contention as
    # much as the tests.  Same commit, two runs on 2026-08-12:
    #
    #   testBarraquandThreeValues   8.42 s -> 47.57 s   (ceiling 30 s)
    #   testAllMultiStepProducts   16.96 s -> 31.71 s   (ceiling 30 s)
    #   testPathwiseVegas           5.34 s -> 11.12 s   (Fast limit 8 s)
    #
    # 5.6x on identical code.  The tests are correctly tiered -- 8.42 s sits
    # well inside Slow's ceiling -- so moving them, raising the thresholds or
    # trimming their path counts would all have papered over a measurement
    # error rather than a test problem.
    #
    # The findings stay visible in the log and the job still reports red; it
    # just no longer fails the run.  cayuga reached the same conclusion for
    # wall-clock assertions (CAYUGA_PERF_TIMING_RELIABLE) and hft-core for its
    # latency tests (HFT_SKIP_UNLESS_TIMED_BUILD), both because the runner is
    # shared.  To get a trustworthy reading, dispatch the workflow when the box
    # is quiet and read this job's output.
    continue-on-error: true
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    steps:
      - uses: actions/checkout@v7

      - name: Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-ci-test-times-${{ github.ref }}
          restore-keys: |
            linux-ci-test-times-${{ github.ref }}
            linux-ci-test-times-refs/heads/master
            linux-ci-test-times-

      - name: Build
        shell: bash
        run: |
          ./autogen.sh
          ./configure --disable-static --disable-json-marketdata \
            CC="ccache gcc" CXX="ccache g++" CXXFLAGS="-O2 -g0"
          make -j"$(nproc)"

      - name: Run faster tests
        shell: bash
        run: |
          ./test-suite/quantlib-test-suite --logger=JUNIT,warning,faster.xml:HRF,message -- --faster

      - name: Run fast tests
        shell: bash
        run: |
          ./test-suite/quantlib-test-suite --logger=JUNIT,warning,fast.xml:HRF,message -- --fast

      - name: Run all tests
        shell: bash
        run: |
          ./test-suite/quantlib-test-suite --logger=JUNIT,warning,all.xml:HRF,message

      - name: Save test times
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: ./*.xml

      - name: Check test times
        shell: bash
        run: |
          python3 ./tools/check_test_times.py

  # ===== from tidy.yml =====
  # Fork-supported platform is RHEL/CentOS 10+ (memory:
  # project_supported_platforms.md).  Stream 10 ships clang-tidy at LLVM
  # 22.x natively, so there is nothing to install -- the preset's
  # clang-tidy-19 default is overridden on the command line rather than
  # in CMakePresets.json, which upstream owns.
  #
  # Check-only, like format.yml and quickfix's format.yml: the preset
  # runs clang-tidy with -fix, so any finding shows up as a dirty working
  # tree and fails the job.  Upstream's create-pull-request step is gone
  # with the rest of the lballabio[bot] automation -- it depended on
  # secrets.MACHINE_ACCOUNT_PAT and vars.MACHINE_ACCOUNT, neither of
  # which is set on this repo.
  check:
    if: needs.changes.outputs.ci_only != 'true'
    needs: [clang-format, filelists, changes]
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    # Same gcc-toolset-15 activation as linux.yml and sanitizer.yml.  Without
    # it CMake picks Stream 10's default /usr/bin/g++ 14.4.1 and
    # CMakeLists.txt:77 rejects it: "QuantLib requires GCC 15.2.1 or higher".
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    steps:
    - uses: actions/checkout@v7

    - name: Build with clang-tidy
      shell: bash
      # No -DQL_CLANG_TIDY override any more: the preset used to hardcode
      # clang-tidy-19, which does not exist on this host, and the override was
      # a workaround for that.  The preset now says "clang-tidy" and resolves
      # to whatever the host ships (22.x on Stream 10).
      run: |
        cmake --preset linux-ci-build-with-clang-tidy
        cmake --build build/linux-ci-build-with-clang-tidy -j1

    - name: Fail if clang-tidy modified the tree
      shell: bash
      # The preset now runs tidy with -quiet alone, so findings are reported
      # and nothing is rewritten; this step should never fire.  Kept as a
      # tripwire in case -fix is reintroduced -- silently rewritten sources
      # are how this job came to compile code no one had reviewed.
      run: |
        if ! git diff --exit-code; then
          echo "::error::clang-tidy modified tracked files; the preset should report, not fix."
          exit 1
        fi
