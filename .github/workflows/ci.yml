name: CI

# One workflow, one run per commit.
#
# This was thirteen separate workflow files.  That layout is right for
# GitHub-hosted runners, where thirteen workflows mean thirteen machines
# working in parallel.  This fork runs on a single self-hosted runner, on a
# machine shared with other repositories' runners, so they never ran in
# parallel -- they only
# produced thirteen runs, thirteen concurrency groups and thirteen pending
# entries per commit.  Merging #9 left 33 runs queued across three commits for
# exactly that reason.
#
# Consolidating does not make a green push faster.  The same jobs still
# execute one at a time on one runner.  What it buys is:
#
#   * one run and one concurrency group per commit instead of thirteen, so the
#     per-SHA keying from #9 preserves one pending run per commit rather than
#     thirteen;
#   * `needs:` ordering, which cannot be expressed across separate workflows.
#
# clang-format and filelists are the gate.  Neither compiles anything and both
# finish in seconds, so making the other twelve jobs wait on them costs
# nothing when they pass and skips ~29 jobs when they do not.  Before this, a
# formatting typo still burned the entire Linux matrix.
#
# Job-level `if:` carries the tiers chosen by the changes job below.  It used
# to keep linux-nondefault off pull requests, as #8 established.  Since
# 2026-10-17 pull requests run the full sweep, linux-nondefault included, and
# the push of a pull request's merge runs a light tier 2 (quickfix's model).
#
# Every original `on:` block was `push: branches: [master]` plus some subset of
# pull_request / workflow_dispatch, so the union below is faithful rather than
# a widening.

on:
  # Markdown cannot change what CI verifies.  Nothing in the build consumes it:
  # doxygen's FILE_PATTERNS is `*.docs` over Docs/pages, not `*.md`; the three
  # .md files in Makefile.am are EXTRA_DIST entries, which only affect
  # `make dist`, and no job runs dist or distcheck; check_filelists.sh does not
  # look at them.  Only four .md files are tracked, so the saving is modest --
  # but a docs-only commit currently costs 31 jobs, including seventeen full
  # library builds, on a machine shared with other repositories' runners.
  #
  # Docs/** is deliberately NOT ignored.  It holds quantlib.doxy, pages/,
  # quantlibextra.css and quantlibfooter.html, which `make docs` consumes, so
  # ignoring it would disable the only job that validates a doxygen change.
  # That was in the first draft of this filter and was wrong.
  #
  # Safe here because master's protection (since 2026-10-14, #26) blocks only
  # force pushes and deletion and requires no status check, so no required
  # check can be left permanently pending by a skipped run.  If a required
  # status check is ever added, revisit this: a required check that never
  # reports blocks the PR forever.
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  # Push runs are keyed by SHA so each merge commit lands in a group of its own
  # and cannot be superseded.  cancel-in-progress: false is NOT sufficient for
  # that: a concurrency group holds at most one running and one pending run,
  # and a newer arrival evicts the pending one, so two merges in quick
  # succession silently drop the first commit's validation.
  #
  # Observed, not theoretical: merging #8 cancelled the then-ref-keyed Linux
  # build's pending master run outright, while the two workflows that PR had
  # already keyed by SHA kept theirs and ran both commits.
  #
  # Pull requests and workflow_dispatch keep ref-keying, so a new push to a
  # branch supersedes its previous run instead of queueing behind it.  The dev
  # host has one quantlib-dev runner, beside other repositories' runners, and
  # GitHub cancels runs that sit queued for 24 hours.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # ===== temporary files and the compile cache =====
  # Every job starts with the same step.  It points TMPDIR at the runner's
  # temporary directory and ccache at a persistent directory of QuantLib's own.
  # It writes them to $GITHUB_ENV because job-level env can read neither the
  # runner context nor $HOME.
  #
  # TMPDIR: gcc writes its intermediate files to $TMPDIR, else /tmp, and on the
  # dev host /tmp is on the root filesystem, which other work on the host had
  # filled to 847 MB free on 2026-10-17.  RUNNER_TEMP is under the runner's
  # _work directory, on /home, and the runner empties it at the start and end
  # of every job.  The mkstemp() templates in test-suite/csvquoteloader.cpp,
  # test-suite/jsonquoteloader.cpp and Examples/XvaSnapshot name /tmp outright;
  # they write a few hundred bytes each and are not changed here.
  #
  # ccache: hendrikmuhs/ccache-action kept the cache in GitHub's cache service,
  # keyed by ref.  GitHub evicts entries unused for 7 days and a pull request's
  # entries are invisible to every other ref, so in both of #29's runs every
  # cached job except linux / Default started cold, at 0-0.5 % hits: 33-58
  # minutes per linux cell against 12-18 warm.  The runner is one persistent
  # machine, so the cache now stays on it (#31): one directory for every job,
  # capped at 10 GB, with ccache's own locking and LRU cleanup.  The action also
  # ran `ccache --set-config` without CCACHE_DIR, which rewrote the account's
  # ~/.config/ccache/ccache.conf on every run.  With CCACHE_DIR set, ccache does
  # not read that file.
  #
  # The ccache variables do nothing in a job whose compiler line does not name
  # ccache.  CodeQL's must not: its tracer extracts each file by watching the
  # compiler run, and a cache hit skips the compiler.  Coverage and clang-tidy
  # are left out until they are checked separately.  Each job that uses ccache
  # prints its own hits from CCACHE_STATSLOG, which lives in RUNNER_TEMP.
  #
  # Trust: a pull request's jobs now write objects that master's jobs read.
  # That stays one trust domain only because the job-started hook
  # (.github/runner/job-started.sh) refuses forks' and Dependabot's jobs, so
  # revisit this if the hook ever admits them.  To empty the cache:
  #   CCACHE_DIR=~/.cache/ccache-quantlib-ci ccache -C

  # ===== from format.yml =====
  # Fork-supported platform is RHEL/CentOS 10+.
  # Stream 10 ships clang-tools-extra
  # at LLVM 22.x natively, so the gate uses dnf instead of pinning
  # apt.llvm.org -- same approach as ~/cayuga/.github/workflows/format.yml.
  # The binary is called by its versioned name because this job sets no PATH
  # and inherits the runner's: an unversioned clang-format earlier on it (pip
  # installs 23.x into ~/.local/bin) would win, and 23.1.0 reports 187
  # violations on a tree that 22.x passes.
  clang-format:
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    steps:
      - name: Set temporary and cache directories
        shell: bash
        run: |
          {
            echo "TMPDIR=${RUNNER_TEMP:?}"
            echo "CCACHE_DIR=${HOME:?}/.cache/ccache-quantlib-ci"
            echo "CCACHE_MAXSIZE=10G"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' files < <(find ql test-suite Examples fuzz-test-suite \
              -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0)
          clang-format-22 --dry-run -Werror "${files[@]}"

  # ===== from filelists.yml =====
  # Fork-supported platform is RHEL/CentOS 10+.
  # Despite the name, the check only
  # diffs file lists -- no actual MSVC build.
  filelists:
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    steps:
      - name: Set temporary and cache directories
        shell: bash
        run: |
          {
            echo "TMPDIR=${RUNNER_TEMP:?}"
            echo "CCACHE_DIR=${HOME:?}/.cache/ccache-quantlib-ci"
            echo "CCACHE_MAXSIZE=10G"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Configure
        shell: bash
        run: |
          ./autogen.sh
          ./configure --disable-json-marketdata

      - name: Check
        shell: bash
        run: |
          ./tools/check_filelists.sh

  # ===== tier-1 gating =====
  # Nine of the last twelve merges to master touched only .github/, and each
  # ran all 31 jobs -- seventeen full library builds -- to validate a change
  # that cannot reach anything they compile.  This job decides whether the diff
  # is CI-config-only; if it is, the sweep collapses to the two gates plus a
  # single default-configuration build.
  #
  # Fail-safe by construction: an unknown base ref, a force-push, a
  # workflow_dispatch, an empty diff or any git error all yield false, which
  # runs the full sweep.  The classification is echoed into the log on every
  # run so a wrong call is visible where it happened rather than inferred
  # afterwards from what did not execute.
  #
  # A pull request is diffed against the first parent of github.sha.  That
  # commit is the test merge GitHub built, and its first parent is the base
  # tip it merged into.  The payload's pull_request.base.sha is not that tip.
  # In #27's run 38628809009 it was 94bcae858, while the merge was built
  # against 0dd2dad42, so master's own FORK_CHANGES.md edits counted as the
  # pull request's and a .github-only change ran the full sweep.  A head that
  # is not a merge commit falls back to the full sweep.
  #
  # ===== tier-2 gating =====
  # Tier 2 is the push of the merge commit GitHub creates for a pull request.
  # The pull request's own run was the full sweep, on a test merge with the
  # merge's own tree unless master moved during the review: #29's test merge
  # 3243979b9 and its merge f9bb2ed25 share tree b4fe95156.  Repeating that
  # sweep after the merge added only linux-nondefault, which now runs on pull
  # requests, and on 2026-10-17 it outlasted GitHub's 24-hour queue limit,
  # which cancelled its last queued jobs.  So the push runs what only a run on
  # master can provide: the gates, the default build, CodeQL and coverage.
  # The last two run there because code scanning and Coveralls record master's
  # results only from runs on master.
  #
  # Detection needs all three of: a second parent, a first parent equal to the
  # push's `before`, and GitHub's "Merge pull request #N from" subject.  A
  # squash, a custom merge subject, a local merge or a push carrying more than
  # the merge commit fails one of them and runs the full sweep.  A merge whose
  # base moved during review has an untested tree; the Git Workflow is to
  # update such a branch and wait for a new green run before merging.
  #
  # `light` is the output the jobs gate on: true for tiers 1 and 2.  CodeQL and
  # coverage gate on `ci_only` instead, so they skip only tier 1.  Every gate
  # tests `!= 'true'`, so a missing output runs the job.
  changes:
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    outputs:
      ci_only: ${{ steps.classify.outputs.ci_only }}
      light: ${{ steps.classify.outputs.light }}
    steps:
      - name: Set temporary and cache directories
        shell: bash
        run: |
          {
            echo "TMPDIR=${RUNNER_TEMP:?}"
            echo "CCACHE_DIR=${HOME:?}/.cache/ccache-quantlib-ci"
            echo "CCACHE_MAXSIZE=10G"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the diff
        id: classify
        shell: bash
        run: |
          set -uo pipefail
          head="${{ github.sha }}"
          case "${{ github.event_name }}" in
            pull_request)
              # The test merge's first parent is the base it merged into; the
              # note above says why pull_request.base.sha is not used.
              if git rev-parse -q --verify "$head^2" > /dev/null; then
                base=$(git rev-parse -q --verify "$head^1") || base=""
              else
                echo "head $head is not a merge commit"
                base=""
              fi ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac
          verdict=false
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            if files=$(git diff --name-only "$base" "$head" 2>/dev/null) && [ -n "$files" ]; then
              verdict=true
              while read -r f; do
                [ -z "$f" ] && continue
                # Paths git itself consumes and no build step reads.  LICENSE is
                # deliberately absent: tools/check_copyrights.sh reads it.
                case "$f" in
                  .github/*|.gitignore|.gitattributes|.git-blame-ignore-revs) ;;
                  *) verdict=false; break ;;
                esac
              done <<< "$files"
              echo "changed files ($(wc -l <<< "$files")):"
              sed 's/^/  /' <<< "$files"
            else
              echo "no diff available for $base..$head -- running the full sweep"
            fi
          else
            echo "no usable base ref for event ${{ github.event_name }} -- running the full sweep"
          fi
          echo "ci_only=$verdict" >> "$GITHUB_OUTPUT"
          # Tier 2: the push of a pull request's merge (the note above).
          merged=false
          if [ "${{ github.event_name }}" = push ]; then
            before="${{ github.event.before }}"
            first=$(git rev-parse -q --verify "$head^1") || first=""
            subject=$(git log -1 --format=%s "$head" 2>/dev/null) || subject=""
            re='^Merge pull request #[0-9]+ from '
            if ! git rev-parse -q --verify "$head^2" > /dev/null; then
              echo "push head $head has one parent: not a pull-request merge"
            elif [ "$first" != "$before" ]; then
              echo "push head's first parent ${first:-?} is not before $before: the push carries more than a merge"
            elif ! [[ $subject =~ $re ]]; then
              echo "push head's subject is not GitHub's \"Merge pull request #N from\": $subject"
            else
              merged=true
            fi
          fi
          light=false
          if [ "$verdict" = true ] || [ "$merged" = true ]; then light=true; fi
          echo "ci_only=$verdict merged=$merged light=$light"
          echo "light=$light" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = true ]; then
            echo "::notice::tier 1 (CI config only): gates + default build"
          elif [ "$merged" = true ]; then
            echo "::notice::tier 2 (pull-request merge): gates + default build + CodeQL + coverage"
          else
            echo "::notice::tier 3 (full): all 32 jobs"
          fi

  # ===== from headers.yml =====

  headers:
    if: needs.changes.outputs.light != 'true'
    needs: [clang-format, filelists, changes]
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    steps:
    - name: Set temporary and cache directories
      shell: bash
      run: |
        {
          echo "TMPDIR=${RUNNER_TEMP:?}"
          echo "CCACHE_DIR=${HOME:?}/.cache/ccache-quantlib-ci"
          echo "CCACHE_MAXSIZE=10G"
          echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
        } >> "$GITHUB_ENV"
    - uses: actions/checkout@v7
    - name: Check
      env:
        CXX: ccache g++
      run: |
        ./tools/check_all_headers.sh
    - name: Show compile cache statistics
      if: always()
      shell: bash
      run: |
        stats=$(ccache --show-log-stats)
        printf '%s\n' "$stats"
        printf '### ccache\n\n~~~\n%s\n~~~\n' "$stats" >> "$GITHUB_STEP_SUMMARY"
        if [ -d "$CCACHE_DIR" ]; then du -sh "$CCACHE_DIR"; fi

  # ===== from linux.yml =====
  # Fork-supported platform is RHEL/CentOS 10+.
  # Builds run inside the public
  # CentOS Stream 10 container; gcc-toolset-15 is activated via env
  # vars so every step picks up GCC 15 without a per-step `scl enable`
  # wrapper (matches the pattern in ~/cayuga/.github/workflows).
  #
  # The matrix exercises QuantLib's QL_*-driven config space.  Each
  # cell flips one configureflags / cxxflags axis; the default cell
  # (no flags) covers the baseline c++23 build.
  #
  # Every cell now carries tests: true.  linux-full-tests.yml used to run the
  # same twelve cells -- identical in name AND in configureflags/cxxflags, 0 of
  # 12 differing -- for no reason other than to run the test suite on the two
  # cells this file skipped (C++26 mode, Unity build enabled).  It paid twelve
  # uncached rebuilds for two cells' worth of extra testing, because it did not
  # use ccache.  Setting tests: true on those two here buys exactly the same
  # coverage inside the ccache'd build, so that file is gone and a push to
  # master costs 31 jobs instead of 43.
  #
  # The `if: ${{ matrix.tests }}` guards below are kept rather than deleted: the
  # axis is how a cell is declared build-only, and a future cell that cannot run
  # the suite (a cross-build, say) should be able to say so.
  linux:
    needs: [clang-format, filelists, changes]
    name: linux / ${{ matrix.name }}
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    # gcc-toolset-15 path/lib activation.  CentOS Stream 10 ships with
    # GCC 14 by default; the fork floor is GCC >= 15.2.1 (CMakeLists.txt).
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(needs.changes.outputs.light == 'true'
          && '[{"name":"Default (c++23, no extra flags)","shortname":"default","tests":true}]'
          || '[{"name":"Default (c++23, no extra flags)","shortname":"default","tests":true},{"name":"C++26 mode","shortname":"c++26","cxxflags":"-std=c++26","tests":true},{"name":"Unity build enabled","shortname":"unity","configureflags":"--enable-unity-build","tests":true},{"name":"Intraday calculations enabled","shortname":"intraday","configureflags":"--enable-intraday","tests":true},{"name":"Throwing in cycles enabled","shortname":"cycles","configureflags":"--enable-throwing-in-cycles --disable-faster-lazy-objects","tests":true},{"name":"Indexed coupons enabled","shortname":"indexed","configureflags":"--enable-indexed-coupons","tests":true},{"name":"Standard Library classes enabled","shortname":"stdclasses","configureflags":"--enable-std-classes","tests":true},{"name":"Thread-safe observer enabled","shortname":"threadsafe","configureflags":"--enable-thread-safe-observer-pattern","tests":true},{"name":"Sessions enabled","shortname":"sessions","configureflags":"--enable-sessions","tests":true},{"name":"OpenMP enabled","shortname":"openmp","configureflags":"--enable-openmp","tests":true},{"name":"Parallel unit-test runner","shortname":"paralleltests","configureflags":"--enable-parallel-unit-test-runner","tests":true},{"name":"Null as function template","shortname":"nullfunctions","configureflags":"--enable-null-as-functions","tests":true}]') }}
    steps:
      - name: Set temporary and cache directories
        shell: bash
        run: |
          {
            echo "TMPDIR=${RUNNER_TEMP:?}"
            echo "CCACHE_DIR=${HOME:?}/.cache/ccache-quantlib-ci"
            echo "CCACHE_MAXSIZE=10G"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Compiler version
        shell: bash
        run: |
          gcc --version

      - name: Build
        shell: bash
        run: |
          ./autogen.sh
          # --prefix into the workspace so the later `make install` step in
          # "Check global header" doesn't need root to write to /usr/local.
          ./configure --prefix="$GITHUB_WORKSPACE/install" --disable-static ${{ matrix.configureflags }} \
            CC="ccache gcc" CXX="ccache g++" \
            CXXFLAGS="-O2 -g0 -Wall -Wno-unknown-pragmas -Werror ${{ matrix.cxxflags }}"
          cat ql/config.hpp
          make -j"$(nproc)"

      - name: Show compile cache statistics
        if: always()
        shell: bash
        run: |
          stats=$(ccache --show-log-stats)
          printf '%s\n' "$stats"
          printf '### ccache\n\n~~~\n%s\n~~~\n' "$stats" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "$CCACHE_DIR" ]; then du -sh "$CCACHE_DIR"; fi

      - name: Run tests
        if: ${{ matrix.tests }}
        shell: bash
        run: |
          ./test-suite/quantlib-test-suite --log_level=message

      - name: Run examples
        if: ${{ matrix.tests }}
        shell: bash
        run: |
          make check-examples

      - name: Check global header
        if: ${{ matrix.tests }}
        shell: bash
        run: |
          echo "#include <ql/quantlib.hpp>" > test1.cpp
          echo "int main() { return 0; }" >> test1.cpp
          echo "#include <ql/quantlib.hpp>" > test2.cpp
          make install
          # quantlib-config landed in the workspace prefix (configured above).
          export PATH="$GITHUB_WORKSPACE/install/bin:$PATH"
          g++ -O2 -g0 -Wall -Wno-unknown-pragmas -Werror ${{ matrix.cxxflags }} \
            $(quantlib-config --cflags) test1.cpp test2.cpp $(quantlib-config --libs)

  # ===== from linux-nondefault.yml =====
  # Fork-supported platform is RHEL/CentOS 10+.
  # Stacks every non-default
  # configureflag into a single configure invocation -- the matrix
  # axis is just the cxxflags / extra configureflags variant.
  #
  # Runs on pull requests again since 2026-10-17.  This was a weekly cron
  # ('0 0 * * 0') until it was converted to push + pull_request, which removed
  # the cron but silently promoted a periodic sweep to a per-change gate; #8
  # put it back on master and workflow_dispatch only, when a pull request cost
  # 43 jobs on four cores shared with five other runners.  With the full sweep
  # moved before the merge (tier 2, at the changes job), these cells are what
  # would otherwise be first tested after merging.
  #
  # These five cells are *not* duplicates of linux.yml -- they hardcode
  # --enable-tracing, --enable-extra-safety-checks, --enable-error-functions and
  # friends, configurations nothing else builds.  That is why this file survived
  # the deduplication that removed linux-full-tests.yml, whose twelve cells were
  # identical to linux.yml's in both name and flags.
  linux-nondefault:
    if: needs.changes.outputs.light != 'true'
    needs: [clang-format, filelists, changes]
    name: nondefault / ${{ matrix.name }}
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Default (c++23, no extra flags)"
            shortname: default
          - name: "C++26 mode"
            shortname: c++26
            cxxflags: "-std=c++26"
          - name: "Unity build enabled"
            shortname: unity
            configureflags: --enable-unity-build
          - name: "Standard Library classes enabled"
            shortname: stdclasses
            configureflags: --enable-std-pointers --disable-std-any --disable-std-optional
          - name: "OpenMP enabled"
            shortname: openmp
            configureflags: --enable-openmp
    steps:
      - name: Set temporary and cache directories
        shell: bash
        run: |
          {
            echo "TMPDIR=${RUNNER_TEMP:?}"
            echo "CCACHE_DIR=${HOME:?}/.cache/ccache-quantlib-ci"
            echo "CCACHE_MAXSIZE=10G"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Compiler version
        shell: bash
        run: |
          gcc --version

      - name: Build
        shell: bash
        run: |
          ./autogen.sh
          # --prefix into the workspace so the later `make install` step in
          # "Check global header" doesn't need root to write to /usr/local.
          ./configure --prefix="$GITHUB_WORKSPACE/install" --disable-static \
            --enable-error-lines --enable-error-functions --enable-tracing \
            --enable-indexed-coupons --enable-extra-safety-checks \
            --enable-sessions --enable-thread-safe-observer-pattern \
            --enable-intraday --disable-faster-lazy-objects \
            --enable-throwing-in-cycles --enable-null-as-functions \
            ${{ matrix.configureflags }} \
            CC="ccache gcc" CXX="ccache g++" \
            CPPFLAGS="-Wall -Wno-unknown-pragmas -Wno-array-bounds -Werror" \
            CXXFLAGS="-O2 -g0 ${{ matrix.cxxflags }}"
          cat ql/config.hpp
          make -j"$(nproc)"

      - name: Show compile cache statistics
        if: always()
        shell: bash
        run: |
          stats=$(ccache --show-log-stats)
          printf '%s\n' "$stats"
          printf '### ccache\n\n~~~\n%s\n~~~\n' "$stats" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "$CCACHE_DIR" ]; then du -sh "$CCACHE_DIR"; fi

      - name: Run tests
        shell: bash
        run: |
          ./test-suite/quantlib-test-suite --log_level=message

      - name: Run examples
        shell: bash
        run: |
          make check-examples

      - name: Check global header
        shell: bash
        run: |
          echo "#include <ql/quantlib.hpp>" > test1.cpp
          echo "int main() { return 0; }" >> test1.cpp
          echo "#include <ql/quantlib.hpp>" > test2.cpp
          make install
          export PATH="$GITHUB_WORKSPACE/install/bin:$PATH"
          g++ -O2 -g0 -Wall -Wno-unknown-pragmas -Werror ${{ matrix.cxxflags }} \
            $(quantlib-config --cflags) test1.cpp test2.cpp $(quantlib-config --libs)

  # ===== from sanitizer.yml =====
  # Fork-supported platform is RHEL/CentOS 10+.
  # Modeled on
  # ~/cayuga/.github/workflows/sanitizers.yml: ASan/TSan/UBSan are
  # separate matrix cells for clearer attribution; TSan is routed
  # through Clang to dodge gcc bug 93922 (atomic_thread_fence won't
  # compile under GCC's -fsanitize=thread).
  sanitizer:
    if: needs.changes.outputs.light != 'true'
    needs: [clang-format, filelists, changes]
    name: ${{ matrix.sanitizer }}
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    strategy:
      fail-fast: false
      matrix:
        include:
          # ASan + leak detection.  Routed through gcc-toolset-15.
          - sanitizer: asan
            cc: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
            cxx: /opt/rh/gcc-toolset-15/root/usr/bin/g++
            extra_path: /opt/rh/gcc-toolset-15/root/usr/bin
            extra_ld: /opt/rh/gcc-toolset-15/root/usr/lib64
            extra_cxxflags: ""
            sanitizer_cxxflags: "-fsanitize=address -fno-sanitize-recover=all -fno-omit-frame-pointer"
            configureflags: ""
          # TSan.  Routed through Clang because GCC's TSan refuses to
          # compile std::atomic_thread_fence (gcc bug 93922).  Pinned
          # to system GCC 14's libstdc++ via --gcc-install-dir to
          # prevent Clang from auto-detecting the gcc-toolset-15
          # libstdc++-15 (constexpr/template-instantiation skew).
          - sanitizer: tsan
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
            extra_path: ""
            extra_ld: ""
            # -Wno-deprecated-declarations: Clang 22 + Boost 1.83 ublas
            # iterator headers use the deprecated std::iterator base
            # class; with -Werror this turns into a compile error.  GCC
            # tolerates it; Clang doesn't.  Boost >= 1.84 removes the
            # use, so this flag becomes unneeded once EL10 ships a
            # newer Boost.
            extra_cxxflags: "--gcc-install-dir=/usr/lib/gcc/x86_64-redhat-linux/14 -Wno-deprecated-declarations"
            sanitizer_cxxflags: "-fsanitize=thread -fno-sanitize-recover=all"
            configureflags: "--enable-sessions --enable-thread-safe-observer-pattern"
          # UBSan.  Umbrella -fsanitize=undefined; gcc-toolset-15.
          - sanitizer: ubsan
            cc: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
            cxx: /opt/rh/gcc-toolset-15/root/usr/bin/g++
            extra_path: /opt/rh/gcc-toolset-15/root/usr/bin
            extra_ld: /opt/rh/gcc-toolset-15/root/usr/lib64
            extra_cxxflags: ""
            sanitizer_cxxflags: "-fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
            configureflags: ""
    steps:
      - name: Set temporary and cache directories
        shell: bash
        run: |
          {
            echo "TMPDIR=${RUNNER_TEMP:?}"
            echo "CCACHE_DIR=${HOME:?}/.cache/ccache-quantlib-ci"
            echo "CCACHE_MAXSIZE=10G"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Compiler version
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          if [ -n "${{ matrix.extra_path }}" ]; then
            export PATH="${{ matrix.extra_path }}:$PATH"
          fi
          $CXX --version

      - name: Build
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ -n "${{ matrix.extra_path }}" ]; then
            export PATH="${{ matrix.extra_path }}:$PATH"
          fi
          if [ -n "${{ matrix.extra_ld }}" ]; then
            export LD_LIBRARY_PATH="${{ matrix.extra_ld }}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          ./autogen.sh
          ./configure --disable-static ${{ matrix.configureflags }} \
            CC="ccache $CC" CXX="ccache $CXX" \
            CXXFLAGS="-O2 -g0 ${{ matrix.sanitizer_cxxflags }} ${{ matrix.extra_cxxflags }} -Wall -Wno-unknown-pragmas -Werror"
          make -j"$(nproc)"

      - name: Show compile cache statistics
        if: always()
        shell: bash
        run: |
          stats=$(ccache --show-log-stats)
          printf '%s\n' "$stats"
          printf '### ccache\n\n~~~\n%s\n~~~\n' "$stats" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "$CCACHE_DIR" ]; then du -sh "$CCACHE_DIR"; fi

      - name: Run tests
        shell: bash
        env:
          ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:detect_leaks=1"
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          LSAN_OPTIONS: "suppressions=.lsan.txt"
        run: |
          if [ -n "${{ matrix.extra_ld }}" ]; then
            export LD_LIBRARY_PATH="${{ matrix.extra_ld }}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          ./test-suite/quantlib-test-suite --log_level=message

      - name: Run examples
        shell: bash
        run: |
          if [ -n "${{ matrix.extra_ld }}" ]; then
            export LD_LIBRARY_PATH="${{ matrix.extra_ld }}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          make check-examples

  # ===== from cmake.yml =====
  # Fork-supported platform is RHEL/CentOS 10+.
  # Windows + macOS cells removed
  # along with macos.yml / msvc*.yml / cmake-latest-runners.yml -- the
  # fork doesn't claim those targets.
  cmake-linux:
    if: needs.changes.outputs.light != 'true'
    needs: [clang-format, filelists, changes]
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    steps:
      - name: Set temporary and cache directories
        shell: bash
        run: |
          {
            echo "TMPDIR=${RUNNER_TEMP:?}"
            echo "CCACHE_DIR=${HOME:?}/.cache/ccache-quantlib-ci"
            echo "CCACHE_MAXSIZE=10G"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Compile
        shell: bash
        run: |
          mkdir build
          cd build
          # CMAKE_INSTALL_PREFIX points at the workspace so `cmake --install .`
          # writes into ${GITHUB_WORKSPACE}/install (writable by the runner
          # user) instead of /usr/local (root-owned on the dev host).
          cmake .. -GNinja -DBOOST_ROOT=/usr -DCMAKE_BUILD_TYPE=Release \
            -DQL_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -L
          cat ql/config.hpp
          cmake --build . --verbose
          cmake --install .

      - name: Show compile cache statistics
        if: always()
        shell: bash
        run: |
          stats=$(ccache --show-log-stats)
          printf '%s\n' "$stats"
          printf '### ccache\n\n~~~\n%s\n~~~\n' "$stats" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "$CCACHE_DIR" ]; then du -sh "$CCACHE_DIR"; fi

      - name: Test
        shell: bash
        run: |
          # Workspace-local install: PATH for the test binary, LD_LIBRARY_PATH
          # for libQuantLib.so.1.  Replaces the previous /etc/ld.so.conf.d/...
          # + ldconfig dance that needed root.
          export PATH="$GITHUB_WORKSPACE/install/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/install/lib64:$GITHUB_WORKSPACE/install/lib:${LD_LIBRARY_PATH:-}"
          quantlib-test-suite --log_level=message

      - name: Run benchmark
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/install/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/install/lib64:$GITHUB_WORKSPACE/install/lib:${LD_LIBRARY_PATH:-}"
          quantlib-benchmark --size=1

  cmake-linux-with-options:
    if: needs.changes.outputs.light != 'true'
    needs: [clang-format, filelists, changes]
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    steps:
      - name: Set temporary and cache directories
        shell: bash
        run: |
          {
            echo "TMPDIR=${RUNNER_TEMP:?}"
            echo "CCACHE_DIR=${HOME:?}/.cache/ccache-quantlib-ci"
            echo "CCACHE_MAXSIZE=10G"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Compile
        shell: bash
        run: |
          # Append -DCMAKE_INSTALL_PREFIX so the preset's install target lands
          # in the workspace; root-only /usr/local writes are off the table.
          cmake --preset linux-ci-build-with-nonstandard-options \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" -L
          cd build/linux-ci-build-with-nonstandard-options
          cat ql/config.hpp
          cmake --build . --verbose
          cmake --build . --target install

      - name: Show compile cache statistics
        if: always()
        shell: bash
        run: |
          stats=$(ccache --show-log-stats)
          printf '%s\n' "$stats"
          printf '### ccache\n\n~~~\n%s\n~~~\n' "$stats" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "$CCACHE_DIR" ]; then du -sh "$CCACHE_DIR"; fi

      - name: Test
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/install/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/install/lib64:$GITHUB_WORKSPACE/install/lib:${LD_LIBRARY_PATH:-}"
          quantlib-test-suite --log_level=message

