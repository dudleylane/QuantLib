name: CMake build

# Fork-supported platform is RHEL/CentOS 10+ (memory:
# project_supported_platforms.md).  Windows + macOS cells removed
# along with macos.yml / msvc*.yml / cmake-latest-runners.yml -- the
# fork doesn't claim those targets.

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  # Push runs are keyed by SHA so each merge commit lands in a group of its own
  # and cannot be superseded.  cancel-in-progress: false is NOT sufficient for
  # that: a concurrency group holds at most one running and one pending run,
  # and a newer arrival evicts the pending one, so two merges in quick
  # succession silently drop the first commit's validation.
  #
  # Observed, not theoretical: merging #8 cancelled this workflow's pending
  # master run outright, while the two workflows that PR had already keyed by
  # SHA kept theirs and ran both commits.
  #
  # Pull requests and workflow_dispatch keep ref-keying, so a new push to a
  # branch supersedes its previous run instead of queueing behind it.  The dev
  # host has one quantlib-dev runner shared with five other repos, and GitHub
  # cancels runs that sit queued for 24 hours.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  cmake-linux:
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    steps:
      - uses: actions/checkout@v6

      - name: Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cmake-linux-ci-build-${{ github.ref }}
          restore-keys: |
            cmake-linux-ci-build-${{ github.ref }}
            cmake-linux-ci-build-refs/heads/master
            cmake-linux-ci-build-

      - name: Compile
        shell: bash
        run: |
          mkdir build
          cd build
          # CMAKE_INSTALL_PREFIX points at the workspace so `cmake --install .`
          # writes into ${GITHUB_WORKSPACE}/install (writable by the runner
          # user) instead of /usr/local (root-owned on the dev host).
          cmake .. -GNinja -DBOOST_ROOT=/usr -DCMAKE_BUILD_TYPE=Release \
            -DQL_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -L
          cat ql/config.hpp
          cmake --build . --verbose
          cmake --install .

      - name: Test
        shell: bash
        run: |
          # Workspace-local install: PATH for the test binary, LD_LIBRARY_PATH
          # for libQuantLib.so.1.  Replaces the previous /etc/ld.so.conf.d/...
          # + ldconfig dance that needed root.
          export PATH="$GITHUB_WORKSPACE/install/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/install/lib64:$GITHUB_WORKSPACE/install/lib:${LD_LIBRARY_PATH:-}"
          quantlib-test-suite --log_level=message

      - name: Run benchmark
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/install/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/install/lib64:$GITHUB_WORKSPACE/install/lib:${LD_LIBRARY_PATH:-}"
          quantlib-benchmark --size=1

  cmake-linux-with-options:
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    steps:
      - uses: actions/checkout@v6

      - name: Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cmake-linux-ci-opts-${{ github.ref }}
          restore-keys: |
            cmake-linux-ci-opts-${{ github.ref }}
            cmake-linux-ci-opts-refs/heads/master
            cmake-linux-ci-opts-

      - name: Compile
        shell: bash
        run: |
          # Append -DCMAKE_INSTALL_PREFIX so the preset's install target lands
          # in the workspace; root-only /usr/local writes are off the table.
          cmake --preset linux-ci-build-with-nonstandard-options \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" -L
          cd build/linux-ci-build-with-nonstandard-options
          cat ql/config.hpp
          cmake --build . --verbose
          cmake --build . --target install

      - name: Test
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/install/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/install/lib64:$GITHUB_WORKSPACE/install/lib:${LD_LIBRARY_PATH:-}"
          quantlib-test-suite --log_level=message
