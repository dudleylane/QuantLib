name: Sanitizers

# ASan, TSan and UBSan, each its own job for clear attribution, all gating.  Format Check's header
# says how this CI is laid out, and build-test.yml says why markdown is ignored, what the first
# step does, how the time limits were sized and why a skipped test fails the job.
#
# asan and ubsan: AddressSanitizer, with leak detection, and UndefinedBehaviorSanitizer, each in
# its own gcc-toolset-15 build, which runs the whole suite and the examples.  One job with both
# was approved on 2026-11-22 with the TSan cut, then measured and dropped: the sanitizers' costs
# add, so it would save about 10 job-minutes a warm run and make the asan job, the longest once
# tsan is cut, about 38 minutes longer.
#
# tsan: ThreadSanitizer, built with Clang, with sessions and the thread-safe observer on.  It
# reports a data race only where two threads touch the same memory, so it runs only the test
# cases that start threads, labelled "threads" and picked with --run_test=@threads, and not the
# examples.  tools/check_thread_labels.py keeps that sound.  Before the build it fails the job if
# a test case starts a thread without the label, or if a test-suite file outside a case, an
# example, or the library other than through OpenMP starts one; after the build, if the build has
# OpenMP or the parallel test runner on.  It writes the labelled cases' names, and the skip check
# then fails the job unless exactly those ran and the filter left out every other case.
#
# What the tsan job stopped checking when it stopped running the whole suite and the examples.
# It still compiles both with Clang, CI's only Clang build; it no longer runs:
# - the suite and the examples built with Clang;
# - the suite with sessions and the thread-safe observer on and the other flags at their defaults
#   (Build & Test's nondefault job runs it with them on only beside every other non-default flag);
# - what TSan reports from one thread, such as a lock-order inversion or a mutex destroyed while
#   locked, in the cases that start no thread.
# So a change to locking, or to state that threads share, runs the whole suite under TSan before
# its pull request; CONTRIBUTING's checklist has the commands.

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md']

# As in format.yml: a pull request's newer push cancels its older run; a run on master is never
# cancelled and never waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sanitizer:
    name: ${{ matrix.sanitizer }}
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    # Each sanitizer's own limit.  asan and ubsan: about twice its longest run from 2026-11-11 to
    # 11-21, 129.5 and 112.7 min.  tsan: its longest Build step in that time took 33.7 min, and the
    # labelled cases run in seconds (about 6 s in the job's log of 2026-11-21); 120 is high until
    # the job has its own history.  The builds are -O2 -g0, as before: the whole suite at -O0 under
    # a sanitizer would take many hours.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ASan + leak detection.  gcc-toolset-15.
          - sanitizer: asan
            timeout: 260
            cc: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
            cxx: /opt/rh/gcc-toolset-15/root/usr/bin/g++
            extra_path: /opt/rh/gcc-toolset-15/root/usr/bin
            extra_ld: /opt/rh/gcc-toolset-15/root/usr/lib64
            extra_cxxflags: ""
            sanitizer_cxxflags: "-fsanitize=address -fno-sanitize-recover=all -fno-omit-frame-pointer"
            configureflags: ""
            threads_only: false
          # TSan.  Routed through Clang because GCC's TSan refuses to compile
          # std::atomic_thread_fence (gcc bug 93922), and pinned to system GCC 14's libstdc++ with
          # --gcc-install-dir so that Clang doesn't pick up gcc-toolset-15's libstdc++-15
          # (constexpr/template-instantiation skew).  Sessions and the thread-safe observer are on:
          # they are the configurations whose threads share state.  Only the labelled cases run
          # (the header says why).
          - sanitizer: tsan
            timeout: 120
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
            extra_path: ""
            extra_ld: ""
            # -Wno-deprecated-declarations: Boost 1.83's ublas iterator headers use the deprecated
            # std::iterator base class, which Clang 22 turns into an error under -Werror.  Boost
            # 1.84 removes the use, so the flag can go once EL10 ships a newer Boost.
            extra_cxxflags: "--gcc-install-dir=/usr/lib/gcc/x86_64-redhat-linux/14 -Wno-deprecated-declarations"
            sanitizer_cxxflags: "-fsanitize=thread -fno-sanitize-recover=all"
            configureflags: "--enable-sessions --enable-thread-safe-observer-pattern"
            threads_only: true
          # UBSan.  Umbrella -fsanitize=undefined; gcc-toolset-15.
          - sanitizer: ubsan
            timeout: 230
            cc: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
            cxx: /opt/rh/gcc-toolset-15/root/usr/bin/g++
            extra_path: /opt/rh/gcc-toolset-15/root/usr/bin
            extra_ld: /opt/rh/gcc-toolset-15/root/usr/lib64
            extra_cxxflags: ""
            sanitizer_cxxflags: "-fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
            configureflags: ""
            threads_only: false
    steps:
      - name: Set temporary and cache directories
        shell: bash
        run: |
          {
            echo "TMPDIR=${RUNNER_TEMP:?}"
            echo "CCACHE_DIR=${HOME:?}/.cache/ccache-quantlib-ci"
            echo "CCACHE_MAXSIZE=10G"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      # Before the build, so that a missing label fails the job in seconds.  The labelled cases'
      # names go to the skip check.
      - name: Check that only labelled test cases start threads
        if: matrix.threads_only
        shell: bash
        run: |
          python3 tools/check_thread_labels.py --write "$RUNNER_TEMP/threads.txt"

      - name: Compiler version
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          if [ -n "${{ matrix.extra_path }}" ]; then
            export PATH="${{ matrix.extra_path }}:$PATH"
          fi
          $CXX --version

      - name: Build
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ -n "${{ matrix.extra_path }}" ]; then
            export PATH="${{ matrix.extra_path }}:$PATH"
          fi
          if [ -n "${{ matrix.extra_ld }}" ]; then
            export LD_LIBRARY_PATH="${{ matrix.extra_ld }}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          ./autogen.sh
          ./configure --disable-static ${{ matrix.configureflags }} \
            CC="ccache $CC" CXX="ccache $CXX" \
            CXXFLAGS="-O2 -g0 ${{ matrix.sanitizer_cxxflags }} ${{ matrix.extra_cxxflags }} -Wall -Wno-unknown-pragmas -Werror"
          make -j"$(nproc)"

      - name: Check that the build starts no other threads
        if: matrix.threads_only
        shell: bash
        run: |
          python3 tools/check_thread_labels.py --configured .

      - name: Show compile cache statistics
        if: always()
        shell: bash
        run: |
          stats=$(ccache --show-log-stats)
          printf '%s\n' "$stats"
          printf '### ccache\n\n~~~\n%s\n~~~\n' "$stats" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "$CCACHE_DIR" ]; then du -sh "$CCACHE_DIR" || echo "du exited $? (#401)"; fi

      - name: Run tests
        shell: bash
        env:
          ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:detect_leaks=1"
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          LSAN_OPTIONS: "suppressions=.lsan.txt"
        run: |
          if [ -n "${{ matrix.extra_ld }}" ]; then
            export LD_LIBRARY_PATH="${{ matrix.extra_ld }}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          filter=()
          if [ "${{ matrix.threads_only }}" = true ]; then
            filter=(--run_test=@threads)
          fi
          ./test-suite/quantlib-test-suite "${filter[@]}" --logger=JUNIT,error,"$RUNNER_TEMP/junit.xml":HRF,message

      - name: No test skipped
        shell: bash
        run: |
          filtered=()
          if [ "${{ matrix.threads_only }}" = true ]; then
            filtered=(--filtered "$RUNNER_TEMP/threads.txt")
          fi
          python3 tools/check_no_skipped_tests.py "$RUNNER_TEMP/junit.xml" --config-header ql/config.hpp "${filtered[@]}"

      - name: Run examples
        if: ${{ !matrix.threads_only }}
        shell: bash
        run: |
          if [ -n "${{ matrix.extra_ld }}" ]; then
            export LD_LIBRARY_PATH="${{ matrix.extra_ld }}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          make check-examples
