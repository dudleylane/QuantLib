name: Linux build with non-default configuration

# Fork-supported platform is RHEL/CentOS 10+ (memory:
# project_supported_platforms.md).  Stacks every non-default
# configureflag into a single configure invocation -- the matrix
# axis is just the cxxflags / extra configureflags variant.
#
# Not run on pull requests.  This was a weekly cron ('0 0 * * 0') until it was
# converted to push + pull_request, which removed the cron but silently
# promoted a periodic sweep to a per-change gate; #8 put it back on master and
# workflow_dispatch only.
#
# These five cells are *not* duplicates of linux.yml -- they hardcode
# --enable-tracing, --enable-extra-safety-checks, --enable-error-functions and
# friends, configurations nothing else builds.  That is why this file survived
# the deduplication that removed linux-full-tests.yml, whose twelve cells were
# identical to linux.yml's in both name and flags.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # Push runs are keyed by SHA so each merge commit lands in a group of its own
  # and cannot be superseded.  cancel-in-progress: false is NOT sufficient for
  # that: a group holds at most one running and one pending run, and a newer
  # arrival cancels the pending one, so merging twice in quick succession
  # silently drops the first commit's validation (hft-core lost two merge
  # commits that way, 2026-08-08).  That matters more here now that master is
  # the only branch this workflow runs on.
  #
  # Non-push runs (workflow_dispatch) keep ref-keying so a re-dispatch
  # supersedes the previous one instead of queueing behind it -- the dev host
  # has one quantlib-dev runner, and GitHub cancels runs queued for 24 hours.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, Linux, X64, quantlib-dev]
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Default (c++23, no extra flags)"
            shortname: default
          - name: "C++26 mode"
            shortname: c++26
            cxxflags: "-std=c++26"
          - name: "Unity build enabled"
            shortname: unity
            configureflags: --enable-unity-build
          - name: "Standard Library classes enabled"
            shortname: stdclasses
            configureflags: --enable-std-pointers --disable-std-any --disable-std-optional
          - name: "OpenMP enabled"
            shortname: openmp
            configureflags: --enable-openmp
    steps:
      - uses: actions/checkout@v6

      - name: Compiler version
        shell: bash
        run: |
          gcc --version

      - name: Build
        shell: bash
        run: |
          ./autogen.sh
          # --prefix into the workspace so the later `make install` step in
          # "Check global header" doesn't need root to write to /usr/local.
          ./configure --prefix="$GITHUB_WORKSPACE/install" --disable-static \
            --enable-error-lines --enable-error-functions --enable-tracing \
            --enable-indexed-coupons --enable-extra-safety-checks \
            --enable-sessions --enable-thread-safe-observer-pattern \
            --enable-intraday --disable-faster-lazy-objects \
            --enable-throwing-in-cycles --enable-null-as-functions \
            ${{ matrix.configureflags }} \
            CC="gcc" CXX="g++" \
            CPPFLAGS="-Wall -Wno-unknown-pragmas -Wno-array-bounds -Werror" \
            CXXFLAGS="-O2 -g0 ${{ matrix.cxxflags }}"
          cat ql/config.hpp
          make -j"$(nproc)"

      - name: Run tests
        shell: bash
        run: |
          ./test-suite/quantlib-test-suite --log_level=message

      - name: Run examples
        shell: bash
        run: |
          make check-examples

      - name: Check global header
        shell: bash
        run: |
          echo "#include <ql/quantlib.hpp>" > test1.cpp
          echo "int main() { return 0; }" >> test1.cpp
          echo "#include <ql/quantlib.hpp>" > test2.cpp
          make install
          export PATH="$GITHUB_WORKSPACE/install/bin:$PATH"
          g++ -O2 -g0 -Wall -Wno-unknown-pragmas -Werror ${{ matrix.cxxflags }} \
            $(quantlib-config --cflags) test1.cpp test2.cpp $(quantlib-config --libs)
